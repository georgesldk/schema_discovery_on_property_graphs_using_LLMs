<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schema Discovery - LLM-Powered Graph Schema Inference</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <div class="header-brand">
                <h1>Schema Discovery</h1>
                <span class="subtitle">Property Graph Schema Inference</span>
            </div>
        </header>

        <div class="main-content">
            <!-- Dataset Selection -->
            <div class="card" id="pocCard">
                <div id="datasetSelector" class="dataset-selector">
                    <div class="dataset-field">
                        <label for="datasetSelect">Dataset</label>
                        <select id="datasetSelect">
                            <option value="">Select a dataset...</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-primary" id="processDatasetBtn" disabled>
                        Run Inference
                    </button>
                </div>
                <div id="datasetDescription" class="dataset-description"></div>
            </div>

            <!-- Progress Section -->
            <div class="card hidden" id="progressCard">
                <h2>Processing</h2>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText">Initializing...</p>
                </div>
                <div class="status-message" id="statusMessage"></div>

                <!-- Console Output -->
                <div class="console-section">
                    <h3>Console Output</h3>
                    <div id="consoleOutput"></div>
                </div>

                <div id="viewResultsContainer" class="view-results-container">
                    <button type="button" class="btn btn-primary" id="viewResultsBtn">
                        View Results
                    </button>
                </div>
            </div>

            <!-- Results Section -->
            <div class="card hidden" id="resultsCard">
                <h2>Inferred Schema</h2>
                <div class="results-header">
                    <div class="results-actions">
                        <button class="btn btn-secondary" id="backToConsoleBtn">Back</button>
                        <button class="btn btn-secondary" id="downloadBtn">Download</button>
                        <button class="btn btn-primary" id="compareBtn">Compare</button>
                    </div>
                    <div class="results-nav">
                        <button class="btn btn-secondary" id="prevTabBtn">←</button>
                        <button class="btn btn-secondary" id="nextTabBtn">→</button>
                        <button class="btn btn-secondary" id="newAnalysisBtn">New</button>
                    </div>
                </div>

                <!-- Tab Navigation -->
                <div class="tabs">
                    <button class="tab-btn active" data-tab="schema">Schema View</button>
                    <button class="tab-btn" data-tab="graph">Graph Visualization</button>
                    <button class="tab-btn" data-tab="comparison">Algorithm Validation</button>
                </div>

                <!-- Schema Tab Content -->
                <div class="tab-content active" id="schemaTab">
                    <div class="schema-viewer">
                        <div class="schema-section">
                            <h3>Node Types</h3>
                            <div id="nodeTypes"></div>
                        </div>
                        <div class="schema-section">
                            <h3>Edge Types</h3>
                            <div id="edgeTypes"></div>
                        </div>
                    </div>
                </div>

                <!-- Graph Tab Content -->
                <div class="tab-content hidden" id="graphTab">
                    <div id="graphNetwork"></div>
                </div>

                <!-- Comparison Tab Content -->
                <div class="tab-content hidden" id="comparisonTab">
                    <div id="compareNotRun" class="compare-prompt">
                        <p>Click Compare to run comparison with ground truth</p>
                    </div>

                    <div id="compareRunning" class="compare-running">
                        <h3>Running Comparison</h3>
                        <div id="compareConsoleOutput"></div>
                    </div>

                    <div id="compareResults" class="compare-results">
                        <div class="comparison-header">
                            <h3>Algorithm Performance</h3>
                            <div class="comparison-metrics" id="comparisonMetrics"></div>
                        </div>

                        <div id="compareTables" class="compare-tables"></div>

                        <div class="comparison-graphs">
                            <div class="comparison-graph-panel">
                                <h4>Inferred Schema</h4>
                                <div class="graph-container-small">
                                    <div id="inferredGraphNetwork"></div>
                                </div>
                            </div>
                            <div class="comparison-graph-panel">
                                <h4>Ground Truth</h4>
                                <div class="graph-container-small">
                                    <div id="groundTruthGraphNetwork"></div>
                                </div>
                            </div>
                        </div>
                        <div class="comparison-details" id="comparisonDetails"></div>
                    </div>
                </div>
            </div>

            <!-- Error Section -->
            <div class="card error-card hidden" id="errorCard">
                <h2>Error</h2>
                <p id="errorMessage"></p>
                <button class="btn btn-primary" onclick="resetForm()">Try Again</button>
            </div>
        </div>

        <footer>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
